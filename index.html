<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOURisME</title>
<meta name="description" content="Tours from Tashkent · Toshkentdan turlar · Туры из Ташкента">
<meta name="theme-color" content="#1A0B2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap&subset=cyrillic,latin-ext" rel="stylesheet">
<link rel="preload" as="image" href="img/a1.webp">
<style>
:root{
  --night:#1A0B2E;--violet:#8A3FD6;--pink:#FF6F9C;--gold:#FFC46B;
  --glass:rgba(28,10,52,.66);--line:rgba(255,255,255,.22);
  --head:'Unbounded','Onest',system-ui,sans-serif;--body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.7,.5,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--night);color:#fff;font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
body{}

/* ===== background ===== */
.bg{position:fixed;inset:-2px;z-index:0;overflow:hidden;will-change:transform;transition:transform .25s linear}
.layer{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.3s ease}
.layer.on{opacity:1;animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.05)}to{transform:scale(1.17) translate3d(-1.6%,-1.2%,0)}}
.vlayer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.3s ease}
.vlayer.ok.show{opacity:1}
.shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(70,28,120,.45) 0%,rgba(26,11,46,0) 30%,rgba(26,11,46,.66) 66%,#1A0B2E 100%)}
.glow{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.glow i{position:absolute;width:90vmax;height:90vmax;border-radius:50%;will-change:transform}
.glow i:nth-child(1){left:-45vmax;top:-38vmax;background:radial-gradient(closest-side,rgba(255,130,190,.34),transparent 70%);animation:g1 28s ease-in-out infinite alternate}
.glow i:nth-child(2){right:-55vmax;bottom:-42vmax;background:radial-gradient(closest-side,rgba(138,63,214,.42),transparent 70%);animation:g2 34s ease-in-out infinite alternate}
@keyframes g1{to{transform:translate3d(26vmax,16vmax,0)}}
@keyframes g2{to{transform:translate3d(-24vmax,-14vmax,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.flyer{position:fixed;left:0;top:19%;z-index:2;pointer-events:none;width:44px;height:44px;opacity:0;color:#fff;filter:drop-shadow(0 4px 14px rgba(255,111,156,.9))}
.flyer svg{width:44px;height:44px;transform:rotate(90deg)}
.flyer::before{content:"";position:absolute;right:30px;top:20px;width:120px;height:3px;border-radius:3px;background:linear-gradient(270deg,rgba(255,255,255,.8),transparent);transform:translateY(-1px)}
body[data-s="0"] .flyer{animation:fly 11s ease-in-out 1.2s infinite}
@keyframes fly{0%{transform:translate(-18vw,30px);opacity:0}6%{opacity:1}50%{transform:translate(55vw,-26px)}94%{opacity:1}100%{transform:translate(112vw,20px);opacity:0}}

/* ===== top bar ===== */
.top{position:fixed;left:0;right:0;top:0;z-index:6;padding:calc(env(safe-area-inset-top) + 14px) 14px 0;display:flex;justify-content:center;pointer-events:none}
.top-in{width:100%;max-width:460px;display:flex;align-items:center;gap:10px;pointer-events:auto}
.back{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;transition:opacity .3s,transform .3s var(--spring),box-shadow .3s}
.back[hidden]{display:none}
.back:active{transform:scale(.88);box-shadow:0 0 18px rgba(255,111,156,.7)}
.logo{position:relative;display:flex;font:700 17px/1 var(--head);letter-spacing:.01em;flex:none;user-select:none;filter:drop-shadow(0 2px 14px rgba(138,63,214,.9))}
.logo span{display:inline-block;background:linear-gradient(180deg,#e6ccff,#ffb0d0);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:lpop .7s var(--spring) both;animation-delay:calc(var(--li)*55ms + 150ms)}
.logo span.s{font-size:.74em;align-self:flex-end;padding-bottom:1px}
@keyframes lpop{from{opacity:0;transform:translateY(-10px) scale(.8)}to{opacity:1;transform:none}}
.prog{position:relative;flex:1;height:26px;margin:0 8px 0 2px;transition:opacity .6s}
.top.hide .prog,.top.hide .back{opacity:0;pointer-events:none}
.prog .track{position:absolute;left:0;right:0;top:50%;border-top:2px dashed rgba(255,255,255,.36);transform:translateY(-50%)}
.prog .done{position:absolute;left:0;right:0;top:50%;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--violet),var(--pink),var(--gold));box-shadow:0 0 12px rgba(255,111,156,.9);transform-origin:left;transform:translateY(-50%) scaleX(0);transition:transform .9s cubic-bezier(.5,0,.2,1)}
.prog .dot{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:rgba(255,255,255,.45);transition:background .4s,transform .4s var(--spring),box-shadow .4s}
.prog .dot.on{background:#fff;transform:scale(1.15);box-shadow:0 0 10px rgba(255,255,255,.9)}
.plane{position:absolute;top:50%;left:0;width:26px;height:26px;margin:-13px 0 0 -13px;transition:left .9s cubic-bezier(.5,0,.2,1);color:#fff;filter:drop-shadow(0 0 8px rgba(255,111,156,.95))}
.plane svg{width:26px;height:26px;transform:rotate(90deg);animation:bob 2.8s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(90deg) translateX(-2px)}}
.lang{position:relative;display:flex;flex:none;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--glass);}
.lang i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:linear-gradient(120deg,var(--violet),var(--pink));box-shadow:0 0 14px rgba(255,111,156,.8);transition:transform .45s var(--spring)}
.lang[data-l="uz"] i{transform:translateX(100%)}
.lang button{position:relative;z-index:1;border:0;background:none;color:#fff;font:700 12px var(--body);padding:7px 10px;cursor:pointer;opacity:.75;transition:opacity .3s}
.lang[data-l="ru"] button[data-l="ru"],.lang[data-l="uz"] button[data-l="uz"]{opacity:1}

/* ===== screens ===== */
#stage{position:fixed;inset:0;z-index:4}
.screen{position:absolute;inset:0;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top) + 76px) 16px calc(env(safe-area-inset-bottom) + 18px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  opacity:0;visibility:hidden;pointer-events:none}
.screen::-webkit-scrollbar{display:none}
.screen.active{visibility:visible;pointer-events:auto;animation:inF .5s var(--ease) both}
body.rev .screen.active{animation-name:inB}
.screen.leave{visibility:visible;pointer-events:none;animation:outF .32s ease both}
body.rev .screen.leave{animation-name:outB}
body.vid .layer{animation-play-state:paused}
@keyframes inF{from{opacity:0;transform:translate3d(36px,0,0)}to{opacity:1;transform:none;}}
@keyframes inB{from{opacity:0;transform:translate3d(-36px,0,0)}to{opacity:1;transform:none;}}
@keyframes outF{to{opacity:0;transform:translate3d(-36px,0,0)}}
@keyframes outB{to{opacity:0;transform:translate3d(36px,0,0)}}
.wrap{width:100%;max-width:460px;display:flex;flex-direction:column;min-height:100%}
.rv{opacity:0}
.screen.leave .rv{opacity:1;animation:none}
.screen.leave .w{animation:none;transform:none}
.screen.active .rv{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms + 90ms)}
@keyframes rise{from{opacity:0;transform:translate3d(0,22px,0)}to{opacity:1;transform:none}}
h1,h2{font-family:var(--head);margin:0}
h2{font-size:25px;line-height:1.15;letter-spacing:-.01em;text-shadow:0 2px 24px rgba(20,4,40,.6)}
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding:.06em 0 .18em;margin:-.06em 0 -.18em}
.w{display:inline-block;transform:translateY(110%)}
.screen.active .w{animation:wordIn .85s var(--ease) both;animation-delay:calc(var(--wi)*60ms + 60ms)}
@keyframes wordIn{from{transform:translateY(110%)}to{transform:none}}
em .w{font-style:normal;background:linear-gradient(100deg,#ffd1e6 30%,#fff 45%,var(--gold) 55%,#ffd1e6 70%);background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent}
.screen.active em .w{animation:wordIn .85s var(--ease) both,shine 2.4s ease-in-out 1s 1 forwards;animation-delay:calc(var(--wi)*60ms + 60ms),1s}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
em{font-style:normal}
.sub{margin:8px 0 18px;color:rgba(255,255,255,.84);font-size:15px;line-height:1.45;text-shadow:0 1px 12px rgba(20,4,40,.7)}
.hint{margin:12px 2px 0;font-size:13.5px;color:rgba(255,255,255,.76);line-height:1.4}

/* intro */
.s0 .wrap{justify-content:flex-end}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:13px;font-weight:500;box-shadow:0 0 22px rgba(138,63,214,.45)}
.pill b{width:8px;height:8px;border-radius:50%;background:#6dffb0;box-shadow:0 0 0 0 rgba(109,255,176,.7);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(109,255,176,0)}100%{box-shadow:0 0 0 0 rgba(109,255,176,0)}}
.s0 h1{font-size:31px;line-height:1.14;letter-spacing:-.015em;margin:16px 0 12px;text-shadow:0 4px 30px rgba(20,4,40,.7)}
.s0 p{margin:0 0 18px;font-size:16px;line-height:1.45;color:rgba(255,255,255,.9);text-shadow:0 1px 14px rgba(20,4,40,.8)}
.ticker{overflow:hidden;margin:0 -16px 22px;-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.ticker div{display:flex;gap:10px;width:max-content;animation:tick 38s linear infinite}
.ticker span{white-space:nowrap;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);font-size:13px}
.ticker b{color:var(--gold);font-weight:600}
@keyframes tick{to{transform:translateX(-50%)}}
.fine{margin:12px 0 0;text-align:center;font-size:12.5px;color:rgba(255,255,255,.7)}

/* ===== buttons & glow ===== */
.halo{position:relative;border-radius:18px}
.halo::before{content:"";position:absolute;inset:0;border-radius:18px;z-index:0;box-shadow:0 0 30px rgba(255,111,156,.6),0 12px 44px rgba(138,63,214,.6);animation:breathe 3.4s ease-in-out infinite}
.halo>.btn{position:relative;z-index:1}
@keyframes breathe{50%{opacity:.45}}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:18px;padding:17px 20px;font:700 16px var(--body);color:#fff;text-decoration:none;cursor:pointer;
  background:linear-gradient(120deg,#8A3FD6,#b04fd2 48%,#FF6F9C);box-shadow:0 14px 34px rgba(138,63,214,.55);transition:transform .3s var(--spring),opacity .3s,box-shadow .3s}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-160%) skewX(-20deg);animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%,60%{transform:translateX(-160%) skewX(-20deg)}100%{transform:translateX(420%) skewX(-20deg)}}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.42;box-shadow:none;pointer-events:none}
.btn[disabled]::after{display:none}
.btn.ghost{background:var(--glass);border:1px solid var(--line);box-shadow:none;font-weight:600}
.btn.ghost::after{display:none}
.btn svg{width:20px;height:20px;flex:none;transition:transform .3s}
.btn:hover svg{transform:translateX(3px)}
.cta{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:12px}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.65),rgba(255,255,255,0) 70%);transform:translate(-50%,-50%) scale(0);animation:rip .7s ease-out forwards}
@keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
/* spotlight under finger / mouse */
.spot{--px:50%;--py:50%}
.spot:not(.card)::before,.card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:0;transition:opacity .45s;
  background:radial-gradient(170px circle at var(--px) var(--py),rgba(255,255,255,.3),rgba(255,160,230,.12) 45%,transparent 70%)}
.spot:not(.card):hover::before,.card:hover::after,.spot.hot:not(.card)::before,.card.hot::after{opacity:1}

/* ===== cards ===== */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{position:relative;border:0;padding:0;border-radius:20px;overflow:hidden;aspect-ratio:1/.9;background:#2a1450 var(--img) center/cover no-repeat;color:#fff;text-align:left;cursor:pointer;
  box-shadow:0 10px 28px rgba(10,0,30,.4);transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--s,1));transition:transform .3s var(--spring),box-shadow .4s}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,6,40,0) 38%,rgba(20,6,40,.88))}
.card:active{--s:.94}
.card .lbl{position:absolute;left:12px;right:12px;bottom:11px;font:600 14.5px/1.15 var(--body);text-shadow:0 2px 10px rgba(0,0,0,.5)}
.card .price{position:absolute;left:10px;top:10px;padding:5px 10px;border-radius:999px;background:rgba(20,6,40,.55);border:1px solid rgba(255,255,255,.24);font:600 12px var(--body);color:var(--gold);box-shadow:0 0 14px rgba(255,196,107,.3)}
.card .ck{position:absolute;top:9px;right:9px;z-index:2;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--violet));display:grid;place-items:center;transform:scale(0);transition:transform .45s var(--spring);box-shadow:0 0 14px var(--pink)}
.card .ck svg{width:15px;height:15px}
.card.sel{box-shadow:0 0 0 2.5px #fff,0 0 0 5px var(--pink),0 0 34px rgba(255,111,156,.75),0 16px 36px rgba(255,111,156,.4)}
.card.sel .ck{transform:scale(1)}
.card.dest{aspect-ratio:1/1.18}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--glass);color:#fff;font:500 15.5px var(--body);padding:13px 17px;border-radius:999px;cursor:pointer;transition:transform .35s var(--spring),background .3s,border-color .3s,box-shadow .4s}
.chip:active{transform:scale(.93)}
.chip.sel{background:linear-gradient(130deg,var(--violet),var(--pink));border-color:transparent;transform:scale(1.04);box-shadow:0 0 24px rgba(255,111,156,.75),0 8px 22px rgba(138,63,214,.5)}
.grp{margin-bottom:22px}
.grp h3,.ages h3{margin:0 0 10px;font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.74)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;box-shadow:0 0 30px rgba(138,63,214,.25)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px}
.row+.row{border-top:1px solid var(--line)}
.row b{display:block;font-size:16.5px;font-weight:600}
.row small{color:rgba(255,255,255,.68);font-size:13px}
.step{display:flex;align-items:center;gap:14px}
.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.12);color:#fff;font-size:22px;line-height:1;cursor:pointer;transition:transform .3s var(--spring),background .3s,box-shadow .3s}
.step button:active{transform:scale(.84);background:rgba(255,255,255,.28);box-shadow:0 0 18px rgba(255,111,156,.8)}
.step output{display:inline-block;min-width:24px;text-align:center;font:700 24px var(--head);text-shadow:0 0 18px rgba(255,111,156,.8)}
.ages{margin-top:16px;display:none}
.ages.show{display:block;animation:rise .6s var(--ease) both}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--line);background:var(--glass);color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:10px;font:600 17px var(--body);cursor:pointer;text-align:left;transition:transform .35s var(--spring),background .3s,border-color .3s,box-shadow .4s}
.opt:active{transform:scale(.97)}
.opt.sel{background:linear-gradient(130deg,rgba(138,63,214,.95),rgba(255,111,156,.92));border-color:transparent;transform:scale(1.02);box-shadow:0 0 28px rgba(255,111,156,.7)}
.opt .meter{display:flex;gap:4px}
.opt .meter i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3)}
.opt .meter i.f{background:var(--gold);box-shadow:0 0 8px rgba(255,196,107,.8)}
.opt.sel .meter i.f{animation:dotpop .5s var(--spring) both;animation-delay:calc(var(--k)*80ms)}
@keyframes dotpop{from{transform:scale(0)}60%{transform:scale(1.7)}to{transform:scale(1)}}
.opt.plain{font-weight:500;font-size:16px}

/* ===== final ===== */
.field{width:100%;border:1px solid var(--line);background:var(--glass);color:#fff;border-radius:16px;padding:15px 16px;font:500 16px var(--body);outline:none;transition:border-color .3s,box-shadow .3s}
.field::placeholder{color:rgba(255,255,255,.58)}
.field:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,111,156,.5),0 0 24px rgba(255,111,156,.5)}
.passwrap{position:relative;margin:16px 0 14px;perspective:900px}
.passwrap::before{content:"";position:absolute;inset:6% -4%;border-radius:40px;background:radial-gradient(closest-side,rgba(255,111,156,.5),rgba(138,63,214,.32) 62%,transparent)}
.pass{position:relative;padding-bottom:34px;border-radius:22px;background:#fbf7ff;color:#1A0B2E;box-shadow:0 24px 60px rgba(8,0,24,.55);transform:rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg));transform-style:preserve-3d;transition:transform .25s ease-out;animation:print 1.2s var(--ease) both;animation-delay:.25s}
@keyframes print{from{opacity:0;transform:translateY(-40px) rotateX(35deg);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:none;clip-path:inset(-20px -20px -20px -20px)}}
.screen:not(.active) .pass{animation:none;opacity:0}
.pass-top{position:relative;overflow:hidden;padding:18px 20px 16px;border-radius:22px 22px 0 0;background:linear-gradient(120deg,#6a2fb0,#8A3FD6 55%,#d252b8);color:#fff}
.pass-top::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent calc(var(--fx,30%) - 22%),rgba(255,255,255,.2) var(--fx,30%),transparent calc(var(--fx,30%) + 22%));pointer-events:none}
.pass-top small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.route{display:flex;align-items:center;gap:10px;margin-top:6px}
.route b{font:700 34px/1 var(--head);}
.route .line{position:relative;flex:1;border-top:2px dashed rgba(255,255,255,.65);height:0}
.route .line svg{position:absolute;left:0;top:-13px;width:26px;height:26px;transform:rotate(90deg);color:#fff;animation:cruise 3.2s ease-in-out infinite alternate}
@keyframes cruise{to{left:calc(100% - 26px)}}
.cities{display:flex;justify-content:space-between;margin-top:8px;font-size:13.5px;opacity:.95;gap:10px}
.cities span:last-child{text-align:right}
.perf{position:relative;height:0;border-top:2px dashed #d9c8f0;margin:0 16px}
.perf::before,.perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:#1d0b36}
.perf::before{left:-28px}.perf::after{right:-28px}
.pass-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:18px 20px 12px}
.pass-grid div small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#7a5ea6;margin-bottom:3px}
.pass-grid div b{font-size:16px;font-weight:700}
.pass-grid .wide{grid-column:1/-1}
.barcode{position:relative;height:42px;margin:6px 20px 0;border-radius:4px;overflow:hidden;background:repeating-linear-gradient(90deg,#1A0B2E 0 2px,transparent 2px 4px,#1A0B2E 4px 5px,transparent 5px 8px,#1A0B2E 8px 11px,transparent 11px 12px,#1A0B2E 12px 13px,transparent 13px 17px)}
.barcode::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,111,156,.6) 50%,transparent 70%);transform:translateX(-120%);animation:scan 2.6s ease-in-out 1.6s 2}
@keyframes scan{60%,100%{transform:translateX(120%)}}
.code{position:absolute;right:20px;top:calc(100% - 25px);font:600 10px var(--body);letter-spacing:.14em;color:#7a5ea6}
.stamp{position:absolute;right:14px;bottom:84px;padding:8px 12px;border:3px solid #e0368c;border-radius:10px;color:#e0368c;font:700 13px/1.15 var(--head);letter-spacing:.06em;text-align:center;text-transform:uppercase;transform:rotate(-11deg);opacity:0}
.screen.active .stamp{animation:stamp .6s var(--ease) 1.4s both}

/* ---------- отправка на сервер ---------- */
function post(body){
  if(!CFG.ENDPOINT) return;
  try{ fetch(CFG.ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain'},keepalive:true,body:JSON.stringify(body)}).catch(()=>{}); }catch(e){}
}
function track(name, data, custom){
  const id = uid();
  if(window.fbq){ fbq(custom ? 'trackCustom' : 'track', name, data||{}, {eventID:id}); }
  console.info('[track]', name, data||{}, id);
  if(name !== 'Lead') post({a:'event',event_name:name,event_id:id,event_source_url:location.href,fbp:cookie('_fbp'),fbc:cookie('_fbc'),custom_data:data||{},ua:navigator.userAgent,lead_id:LEAD_ID,phone:S.phone});
  return id;
}
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms||8); }catch(e){} };
function fields(){ // ответы на русском, чтобы менеджер читал одинаково
  const b = byId(BUD,S.budget);
  return {lang, name:S.name, phone:S.phone, dests:S.dests[0]==='any'?'Подскажите':S.dests.map(i=>byId(D,i).ru).join(' + '),
    vibe:S.vibe?byId(VIBES,S.vibe).ru:'', when:S.when?byId(WHEN,S.when).ru:'', nights:S.nights?byId(NIGHTS,S.nights).ru:'',
    adults:S.adults, kids:S.kids, ages:S.ages.map(i=>byId(AGES,i).ru).join(', '), budget:b?b.ru:'', passport:S.passport?byId(PASS,S.passport).ru:''};
}
function touch(extra){ post({a:'touch',id:LEAD_ID,fields:fields(),...(extra||{})}); }

/* ---------- язык ---------- */
function splitWords(el, html){
  const d = document.createElement('div'); d.innerHTML = html; let wi = 0;
  (function walk(n){ [...n.childNodes].forEach(c=>{
    if(c.nodeType===3){ const f = document.createDocumentFragment();
      c.textContent.split(/(\s+)/).forEach(tok=>{ if(!tok) return;
        if(/^\s+$/.test(tok)) f.appendChild(document.createTextNode(' '));
        else { const m = document.createElement('span'); m.className='wm'; const s = document.createElement('span'); s.className='w'; s.style.setProperty('--wi',wi++); s.textContent=tok; m.appendChild(s); f.appendChild(m); } });
      c.replaceWith(f);
    } else if(c.nodeType===1) walk(c); }); })(d);
  el.innerHTML = d.innerHTML;
}
function applyText(){
  $$('[data-k]').forEach(el=>{ el.innerHTML = T(el.dataset.k); });
  $$('[data-split]').forEach(el=>splitWords(el, T(el.dataset.split)));
  $('#name').placeholder = T('namePh');
  document.documentElement.lang = lang;
  $('#lang').dataset.l = lang;
}
function setLang(l, keep){
  lang = l; store.set('lang',l); applyText(); buildAll();
  if(cur===7) buildPass();
  if(cur===5) updateHint();
  if(!keep) buzz(6);
}

/* ---------- фон и видео ---------- */
const layers = $$('.layer'); let li = 0, curBg = '';
function setBg(id){
  if(!id || id === curBg) return; curBg = id;
  const nxt = layers[li^1], old = layers[li], src = 'img/'+id+'.webp', im = new Image();
  im.onload = () => { nxt.style.backgroundImage = 'url('+src+')'; nxt.classList.add('on'); old.classList.remove('on'); li ^= 1; };
  im.src = src;
}
const vidMap = {0:$('#v1'), 7:$('#v2')};
function initVideo(el, url){
  el.addEventListener('canplay',()=>{ el.classList.add('ok'); showVid(); },{once:true});
  el.addEventListener('error',()=>{},{once:true});
  el.src = url;
}
function showVid(){ let any = false; for(const k in vidMap){ const v = vidMap[k], on = +k === cur;
  v.classList.toggle('show', on); if(on){ v.play().catch(()=>{}); if(v.classList.contains('ok')) any = true; } else v.pause(); }
  document.body.classList.toggle('vid', any); }
initVideo($('#v1'),'video/start.mp4'); initVideo($('#v2'),'video/end.mp4');
const vibeImg = () => (byId(VIBES,S.vibe)||{}).img;
const destImg = () => { const d = byId(D,S.dests[0]); return d && d.img; };
function bgFor(n){
  let id = 'a1';
  if(n === 2) id = vibeImg() || 'a1'; else if(n >= 3 && n <= 6) id = destImg() || vibeImg() || 'a1'; else if(n === 7) id = 'a2';
  setBg(id);
}

/* ---------- навигация ---------- */
const screens = $$('.screen'), top_ = $('#top'), back = $('#back'), plane = $('#plane'), done = $('#done');
(function(){ const p = $('.prog'); for(let i=0;i<7;i++){ const d = document.createElement('div'); d.className='dot'; d.style.left=(i/6*100)+'%'; p.insertBefore(d, plane); } })();
const dots = $$('.dot');
function progress(){
  const idx = Math.max(0, Math.min(6, cur-1)), pct = idx/6;
  plane.style.left = (pct*100)+'%'; done.style.transform = 'translateY(-50%) scaleX('+pct+')';
  dots.forEach((d,i)=>{ d.classList.toggle('on', i<=idx); d.classList.toggle('now', i===idx && cur>0 && cur<7); });
  top_.classList.toggle('hide', cur===0); back.hidden = cur<=1;
}
function go(n){
  if(n === cur) return;
  document.body.classList.toggle('rev', n < cur);
  const old = screens[cur]; old.classList.remove('active'); old.classList.add('leave'); setTimeout(()=>old.classList.remove('leave'),430);
  cur = n; const s = screens[n]; s.scrollTop = 0; s.classList.add('active');
  document.body.dataset.s = n; progress(); bgFor(n); showVid();
  if(n === 7){ buildPass(); touch(); }
}
back.onclick = () => { buzz(); go(Math.max(1, cur-1)); };

/* ---------- сборка списков ---------- */
const CHECK = '<svg><use href="#i-check"/></svg>';
function price(d){
  const per = d.per==='two' ? (lang==='ru'?' на двоих':' · 2 kishi') : d.per==='fam' ? (lang==='ru'?' на семью':' · oila') : '';
  return lang==='ru' ? {pre:'от '+d.cur, n:d.n, suf:per} : {pre:d.cur, n:d.n, suf:' dan'+per};
}
const priceStr = d => { const p = price(d); return p.pre+p.n+p.suf; };
function buildAll(){
  const sorted = [...D].sort((a,b)=>a.pp-b.pp);
  $('#ticker').innerHTML = sorted.concat(sorted).map(d=>'<span>'+lb(d)+' <b>'+priceStr(d)+'</b></span>').join('');
  $('#gVibe').innerHTML = VIBES.map((v,i)=>'<button class="card spot rv'+(S.vibe===v.id?' sel':'')+'" style="--i:'+(i+4)+';--img:url(img/'+v.img+'_t.webp)" data-v="'+v.id+'"><span class="lbl">'+lb(v)+'</span><span class="ck">'+CHECK+'</span></button>').join('');
  const chips = (sel, arr, key, isSel) => $(sel).innerHTML = arr.map(x=>'<button class="chip spot'+(isSel(x.id)?' sel':'')+'" data-'+key+'="'+x.id+'">'+lb(x)+'</button>').join('');
  chips('#cWhen',WHEN,'when',id=>S.when===id); chips('#cNights',NIGHTS,'nights',id=>S.nights===id); chips('#cAges',AGES,'age',id=>S.ages.includes(id));
  $('#gBud').innerHTML = BUD.map((b,i)=>'<button class="opt spot rv'+(b.m?'':' plain')+(S.budget===b.id?' sel':'')+'" style="--i:'+(i+4)+'" data-b="'+b.id+'"><span>'+lb(b)+'</span>'+(b.m?'<span class="meter">'+[1,2,3,4,5].map(k=>'<i'+(k<=b.m?' class="f" style="--k:'+k+'"':'')+'></i>').join('')+'</span>':'')+'</button>').join('');
  $('#gPass').innerHTML = PASS.map((p,i)=>'<button class="opt spot plain rv'+(S.passport===p.id?' sel':'')+'" style="--i:'+(i+4)+'" data-p="'+p.id+'">'+lb(p)+'</button>').join('');
  $('#telView').textContent = CFG.PHONE_VIEW; $('#telLink').href = 'tel:'+CFG.PHONE_TEL;
  if(S.vibe) renderDests();
}
function renderDests(){
  const list = D.filter(d => S.vibe==='any' || d.t.includes(S.vibe)).sort((a,b)=>a.pp-b.pp);
  $('#gDest').innerHTML = list.map((d,i)=>{ const p = price(d);
    return '<button class="card dest spot rv'+(S.dests.includes(d.id)?' sel':'')+'" style="--i:'+(i+4)+';--img:url(img/'+d.img+'_t.webp)" data-d="'+d.id+'"><span class="price"><span class="cnt" data-n="'+d.n+'" data-pre="'+p.pre+'" data-suf="'+p.suf+'">'+p.pre+p.n+p.suf+'</span></span><span class="lbl">'+lb(d)+'</span><span class="ck">'+CHECK+'</span></button>'; }).join('');
  $$('.cnt').forEach(el=>{
    const n=+el.dataset.n, pre=el.dataset.pre, suf=el.dataset.suf, t0=performance.now()+400;
    const f = t => { const k=Math.min(1,Math.max(0,(t-t0)/900)), e=1-Math.pow(1-k,3);
      if(k<1){ el.textContent = pre+(Math.round(n*(.3+.7*e)/5)*5)+suf; requestAnimationFrame(f); } else el.textContent = pre+n+suf; };
    if(!REDUCED) requestAnimationFrame(f);
  });
  $('#dNext').disabled = !S.dests.length || S.dests[0]==='any';
}

/* ---------- клики ---------- */
const stage = $('#stage');
const sel = (container, attr, val) => container.querySelectorAll('['+attr+']').forEach(b=>b.classList.toggle('sel', b.getAttribute(attr)===val));
function bump(el){ if(!REDUCED) el.animate([{transform:'translateY(45%) scale(.7)',opacity:0,filter:'blur(4px)'},{transform:'none',opacity:1,filter:'blur(0)'}],{duration:340,easing:'cubic-bezier(.2,.9,.3,1.4)'}); }

stage.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if(!t) return;
  if(t.id === 'start'){ buzz(); go(1); return; }
  if(t.dataset.v){
    buzz(); S.vibe = t.dataset.v; sel($('#gVibe'),'data-v',S.vibe);
    S.dests = S.dests.filter(id => { const d = byId(D,id); return d && (S.vibe==='any' || d.t.includes(S.vibe)); });
    if(!startSent){ startSent = true; track('QuizStart',{vibe:S.vibe},true); }
    renderDests(); setBg(vibeImg()); setTimeout(()=>go(2), 420); return;
  }
  if(t.dataset.d){
    buzz(); const id = t.dataset.d;
    S.dests = S.dests.filter(x=>x!=='any'); const i = S.dests.indexOf(id);
    if(i>-1) S.dests.splice(i,1); else { S.dests.push(id); if(S.dests.length>2) S.dests.shift(); }
    $$('#gDest .card').forEach(c=>c.classList.toggle('sel', S.dests.includes(c.dataset.d)));
    $('#dNext').disabled = !S.dests.length; setBg(destImg() || vibeImg()); return;
  }
  if(t.id === 'dNext'){ buzz(); go(3); return; }
  if(t.id === 'anyDest'){ buzz(); S.dests = ['any']; go(3); return; }
  if(t.dataset.when){ buzz(); S.when = t.dataset.when; sel($('#cWhen'),'data-when',S.when); if(S.nights) setTimeout(()=>go(4),420); return; }
  if(t.dataset.nights){ buzz(); S.nights = t.dataset.nights; sel($('#cNights'),'data-nights',S.nights); if(S.when) setTimeout(()=>go(4),420); return; }
  if(t.dataset.st){
    buzz(); const k = t.dataset.st;
    if(k==='a-') S.adults = Math.max(1,S.adults-1); if(k==='a+') S.adults = Math.min(6,S.adults+1);
    if(k==='k-') S.kids = Math.max(0,S.kids-1); if(k==='k+') S.kids = Math.min(4,S.kids+1);
    $('#oA').textContent = S.adults; $('#oK').textContent = S.kids; bump(k[0]==='a'?$('#oA'):$('#oK'));
    $('#ages').classList.toggle('show', S.kids>0);
    if(!S.kids){ S.ages = []; $$('#cAges .chip').forEach(c=>c.classList.remove('sel')); }
    return;
  }
  if(t.dataset.age){ buzz(); const a = t.dataset.age, i = S.ages.indexOf(a); if(i>-1) S.ages.splice(i,1); else S.ages.push(a); t.classList.toggle('sel'); return; }
  if(t.id === 'wNext'){ buzz(); go(5); updateHint(); return; }
  if(t.dataset.b){ buzz(); S.budget = t.dataset.b; sel($('#gBud'),'data-b',S.budget); fireLead(); setTimeout(()=>go(6),520); return; }
  if(t.dataset.p){ buzz(); S.passport = t.dataset.p; sel($('#gPass'),'data-p',S.passport); setTimeout(()=>go(7),520); return; }
  if(t.id === 'cbBtn'){ buzz(); $('#phoneBox').classList.add('show'); t.style.display='none'; $('#phone').focus(); return; }
  if(t.id === 'phoneSend'){
    const v = $('#phone').value.replace(/[^\d+]/g,''); if(v.replace(/\D/g,'').length < 9){ $('#phone').focus(); return; }
    S.phone = v; touch(); track('Contact',{method:'callback'}); $('#phoneBox').classList.remove('show'); $('#thanks').classList.add('show'); buzz(20); return;
  }
});
$('#lang').addEventListener('click', e => { const b = e.target.closest('button'); if(b && b.dataset.l !== lang) setLang(b.dataset.l); });
function updateHint(){
  const d = byId(D,S.dests[0]);
  $('#bHint').textContent = d ? T('hint')(lb(d), priceStr(d)) : '';
}
$('#name').addEventListener('input', e => { S.name = e.target.value.trim(); setTg(); });

/* ---------- Lead ---------- */
const destNames = () => S.dests[0]==='any' ? T('any') : S.dests.map(id=>lb(byId(D,id))).join(' + ');
function fireLead(){
  if(leadSent) return; leadSent = true;
  const b = byId(BUD,S.budget), pax = S.adults + S.kids, f = fields();
  const data = {content_category:f.dests, content_name:f.vibe, num_items:pax, budget:f.budget, when:f.when, nights:f.nights};
  if(b.mid){ data.value = b.mid*pax; data.currency = 'USD'; }
  const eid = track('Lead', data);
  const src = [QS.get('utm_source'),QS.get('utm_campaign'),QS.get('utm_content')].filter(Boolean).join(' / ');
  post({a:'lead',event_id:eid,custom_data:data,ua:navigator.userAgent,url:location.href,
    lead:Object.assign({id:LEAD_ID,fbp:cookie('_fbp'),fbc:cookie('_fbc'),source:src},f)});
}

/* ---------- билет ---------- */
function paxText(){
  const a = S.adults, k = S.kids, L = TXT[lang];
  const A = lang==='ru' ? a+' '+(a===1?L.adult1:L.adultN) : a+' '+L.adultN;
  const K = k ? L.plus + (lang==='ru' ? k+' '+(k===1?L.kid1:(k<5?L.kid2:L.kidN)) : k+' '+L.kidN) : '';
  return A + K;
}
function buildPass(){
  const any = S.dests[0] === 'any', ds = any ? [] : S.dests.map(i=>byId(D,i));
  $('#pCode').textContent = any ? 'ANY' : ds[0].code;
  $('#pCity').textContent = any ? T('any2') : ds.map(d=>lb(d)).join(' + ');
  $('#pPaxV').textContent = paxText();
  $('#pWhenV').textContent = S.when ? lb(byId(WHEN,S.when)) : '—';
  $('#pNightsV').textContent = S.nights ? T('nightsU')(lb(byId(NIGHTS,S.nights))) : '—';
  $('#pVibeV').textContent = S.vibe ? lb(byId(VIBES,S.vibe).short) : '—';
  const b = byId(BUD,S.budget); $('#pBudV').textContent = b ? lb(b) : '—';
  $('#pId').textContent = '№ '+LEAD_ID;
  const note = $('#note');
  if(b && b.mid && ds.length){
    const min = Math.min(...ds.map(d=>d.pp));
    if(b.max < min){ note.textContent = T('low')(min, lb(byId(D,'srl')), priceStr(byId(D,'srl'))); note.classList.add('show'); } else note.classList.remove('show');
  } else note.classList.remove('show');
  setTg();

}
function setTg(){
  const b = byId(BUD,S.budget);
  const txt = T('tgMsg')(LEAD_ID, destNames(), S.when?lb(byId(WHEN,S.when)):'—', S.nights?lb(byId(NIGHTS,S.nights)):'—', paxText(),
    b?lb(b):'—', S.passport?lb(byId(PASS,S.passport)):'—', S.name);
  $('#tgBtn').href = 'https://t.me/'+CFG.TG+'?text='+encodeURIComponent(txt);
}
$('#tgBtn').addEventListener('click', e => { touch({tg:true}); track('Contact',{method:'telegram'}); buzz(15); });
$('#telLink').addEventListener('click', () => track('Contact',{method:'phone'}));



/* ---------- ripple, подсветка под пальцем, наклон ---------- */
document.addEventListener('pointerdown', e => {
  const t = e.target.closest('.spot'); if(!t) return;
  const r = t.getBoundingClientRect(), px = e.clientX-r.left, py = e.clientY-r.top;
  t.style.setProperty('--px',px+'px'); t.style.setProperty('--py',py+'px'); t.classList.add('hot'); setTimeout(()=>t.classList.remove('hot'),500);
  if(t.classList.contains('card') || REDUCED) return;
  const s = document.createElement('span'); s.className = 'rip'; const m = Math.max(r.width,r.height)*2.4;
  s.style.cssText = 'left:'+px+'px;top:'+py+'px;width:'+m+'px;height:'+m+'px'; t.appendChild(s); setTimeout(()=>s.remove(),720);
}, {passive:true});
document.addEventListener('pointermove', e => {
  if(e.pointerType !== 'mouse') return;
  const t = e.target.closest('.spot'); if(t){ const r = t.getBoundingClientRect(); t.style.setProperty('--px',(e.clientX-r.left)+'px'); t.style.setProperty('--py',(e.clientY-r.top)+'px'); }
  const c = e.target.closest('.card'); if(c){ const r = c.getBoundingClientRect(), px = (e.clientX-r.left)/r.width-.5, py = (e.clientY-r.top)/r.height-.5;
    c.style.setProperty('--ry',(px*12)+'deg'); c.style.setProperty('--rx',(-py*12)+'deg'); }
  if(cur===7){ tiltPass((e.clientX/innerWidth-.5)*2, (e.clientY/innerHeight-.5)*2); }
});
document.addEventListener('pointerout', e => { const c = e.target.closest && e.target.closest('.card'); if(c){ c.style.setProperty('--rx','0deg'); c.style.setProperty('--ry','0deg'); } });
const pass = $('#pass');
function tiltPass(x,y){ pass.style.setProperty('--ty',(x*9)+'deg'); pass.style.setProperty('--tx',(-y*7)+'deg'); pass.querySelector('.pass-top').style.setProperty('--fx',(50+x*45)+'%'); }
if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission !== 'function'){
  let busy = false;
  addEventListener('deviceorientation', e => { if(cur!==7 || e.gamma == null || busy) return; busy = true;
    requestAnimationFrame(()=>{ busy = false; tiltPass(Math.max(-25,Math.min(25,e.gamma))/25, Math.max(-25,Math.min(25,(e.beta||45)-45))/25); }); }, {passive:true});
}

/* ---------- старт ---------- */
(function(){
  const lg = $('#logo'); let i = 0; lg.innerHTML = 'TOUR'.split('').map(ch=>'<span style="--li:'+(i++)+'">'+ch+'</span>').join('')
    +'is'.split('').map(ch=>'<span class="s" style="--li:'+(i++)+'">'+ch+'</span>').join('')+'ME'.split('').map(ch=>'<span style="--li:'+(i++)+'">'+ch+'</span>').join('');
  const q = QS.get('lang'), saved = store.get('lang'), nav = (navigator.language||'').toLowerCase();
  lang = (q==='uz'||q==='ru') ? q : (saved==='uz'||saved==='ru') ? saved : (nav.startsWith('uz') ? 'uz' : 'ru');
  applyText(); buildAll(); setBg('a1'); progress();
  setTimeout(()=>{ ['b1','b2','b3','b4','b5','b6','a2'].forEach(id=>{ const im=new Image(); im.src='img/'+id+'.webp'; }); }, 2500);
})();
</script>
