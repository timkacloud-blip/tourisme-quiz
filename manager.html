<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>TOURisME — заявки</title>
<style>
:root{--night:#1A0B2E;--violet:#8A3FD6;--pink:#FF6F9C;--gold:#FFC46B;--card:#251042;--line:rgba(255,255,255,.12);--ok:#43e0a0;--bad:#ff6b7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(120% 60% at 50% -10%,#4b1f8a,transparent 60%),var(--night);color:#fff;font:15px/1.4 Onest,system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;padding:0 14px 90px}
.wrap{max-width:560px;margin:0 auto}
header{position:sticky;top:0;z-index:5;padding:14px 0 10px;background:linear-gradient(180deg,var(--night) 70%,transparent)}
.row{display:flex;align-items:center;gap:10px}
h1{font-size:18px;margin:0;flex:1;background:linear-gradient(100deg,#d9b6ff,#ffb0d0);-webkit-background-clip:text;background-clip:text;color:transparent}
input,button{font:inherit;color:#fff}
input[type=date],input[type=text],input[type=password],input[type=number],input[type=search]{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
input:focus{border-color:#fff}
.ic{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{border-radius:14px;padding:10px 6px;text-align:center;background:rgba(255,255,255,.07);border:1px solid var(--line);cursor:pointer;transition:transform .2s,box-shadow .3s}
.stat:active{transform:scale(.95)}
.stat b{display:block;font-size:22px}
.stat small{font-size:11px;opacity:.7}
.stat.on{box-shadow:0 0 0 2px #fff,0 0 22px rgba(138,63,214,.8)}
.sum{font-size:13px;opacity:.8;margin:-2px 2px 10px}
#q{width:100%;margin-bottom:12px}
.card{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;overflow:hidden;animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#777);box-shadow:0 0 18px var(--c,#777)}
.card.new{--c:var(--gold)}.card.qual{--c:var(--violet)}.card.sale{--c:var(--ok)}.card.trash{--c:#555;opacity:.6}
.top{display:flex;align-items:center;gap:8px}
.code{font-weight:700;letter-spacing:.08em;padding:3px 9px;border-radius:8px;background:rgba(255,255,255,.12)}
.time{opacity:.65;font-size:13px}
.badge{margin-left:auto;font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(67,224,160,.16);color:var(--ok)}
.badge.no{background:rgba(255,255,255,.08);color:#aaa}
.name{font-size:17px;font-weight:600;margin:8px 0 2px}
.name a{color:var(--gold);text-decoration:none;margin-left:8px;font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.kv span:nth-child(odd){opacity:.6}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.b{border:1px solid var(--line);border-radius:12px;padding:11px 4px;background:rgba(255,255,255,.07);cursor:pointer;font-weight:600;transition:transform .2s var(--e,ease),background .3s,box-shadow .3s}
.b:active{transform:scale(.94)}
.b.t.on{background:#4a4a55;box-shadow:0 0 16px rgba(255,255,255,.2)}
.b.q.on{background:var(--violet);box-shadow:0 0 18px var(--violet)}
.b.s.on{background:#1fa971;box-shadow:0 0 18px var(--ok)}
.note{margin-top:8px;font-size:13px;opacity:.8}
.empty{text-align:center;opacity:.6;padding:50px 0}
.login{max-width:340px;margin:18vh auto 0;text-align:center}
.login input{width:100%;margin:14px 0}
.login button{width:100%;border:0;border-radius:14px;padding:13px;font-weight:700;background:linear-gradient(120deg,var(--violet),var(--pink));cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(10,0,25,.6);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.show{display:flex}
.sheet div{width:100%;max-width:560px;background:#2a1450;border-radius:22px 22px 0 0;padding:20px;animation:up .35s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet input{width:100%;margin:10px 0}
.err{color:var(--bad);font-size:13px;min-height:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(40px);opacity:0;background:#fff;color:#1A0B2E;padding:10px 18px;border-radius:999px;font-weight:600;transition:.35s;z-index:30}
.toast.show{transform:translateX(-50%);opacity:1}
</style>
</head>
<body>
<div class="wrap">

<div id="login" class="login" hidden>
  <h1 style="font-size:24px">TOURisME · заявки</h1>
  <input id="key" type="password" placeholder="Пароль менеджера" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button id="enter">Войти</button>
</div>

<div id="app" hidden>
  <header>
    <div class="row">
      <h1>Заявки</h1>
      <input type="date" id="day">
      <button class="ic" id="refresh" aria-label="Обновить">↻</button>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="sum" id="sum"></div>
  <input id="q" type="search" placeholder="Код заявки или телефон">
  <div id="list"></div>
</div>
</div>

<div class="sheet" id="sheet"><div>
  <b>Сумма продажи, $</b>
  <input id="amt" type="number" inputmode="decimal" placeholder="Например 1800">
  <input id="note" type="text" placeholder="Комментарий (необязательно)">
  <button class="b s on" style="width:100%" id="amtOk">Сохранить продажу</button>
  <button class="b" style="width:100%;margin-top:8px" id="amtNo">Отмена</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
// Адрес Apps Script (после «Развернуть» → «Веб-приложение»). Вставьте сюда.
const ENDPOINT = '';

const $ = s => document.querySelector(s);
const ls = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };
let KEY = ls.get('mk') || '', DAY = '', FILTER = 'all', DATA = null, pending = null;
const today = () => new Date(Date.now()+5*3600e3).toISOString().slice(0,10);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),1800); }

async function api(body){
  if(!ENDPOINT) throw new Error('Не указан ENDPOINT в manager.html');
  const r = await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({key:KEY},body))});
  return r.json();
}
async function load(){
  try{
    const r = await api({a:'list',day:DAY});
    if(!r.ok){ if(r.error==='auth'){ ls.set('mk',''); show(false); $('#lerr').textContent='Неверный пароль'; } return; }
    DATA = r; render();
  }catch(e){ toast(e.message||'Нет связи'); }
}
function show(app){ $('#login').hidden = app; $('#app').hidden = !app; }

const ST = {new:'Новая',qual:'Квал',sale:'Продажа',trash:'Треш'};
function render(){
  const s = DATA.stats, n = DATA.items.length;
  const tiles = [['all','Все',n],['new','Новые',s.new||0],['qual','Квал',s.qual||0],['sale','Продажи',s.sale||0]];
  $('#stats').innerHTML = tiles.map(t=>'<div class="stat'+(FILTER===t[0]?' on':'')+'" data-f="'+t[0]+'"><b>'+t[2]+'</b><small>'+t[1]+'</small></div>').join('');
  $('#sum').textContent = 'Треш: '+(s.trash||0)+' · Сумма продаж: $'+(s.amount||0);
  const q = $('#q').value.trim().toLowerCase();
  const items = DATA.items.filter(o=>(FILTER==='all'||o.status===FILTER)&&(!q||String(o.id).toLowerCase().includes(q)||String(o.phone).replace(/\D/g,'').includes(q.replace(/\D/g,'')||'§')));
  $('#list').innerHTML = items.length ? items.map(card).join('') : '<div class="empty">Заявок нет</div>';
}
function card(o,i){
  const t = String(o.created).slice(11,16), dest = o.dests||'—';
  const pax = o.adults+' взр.'+(Number(o.kids)?' + '+o.kids+' дет.'+(o.ages?' ('+o.ages+')':''):'');
  const tg = o.tg_click ? '<span class="badge">нажал Telegram</span>' : '<span class="badge no">Telegram не нажат</span>';
  const ph = o.phone ? '<a href="tel:'+esc(o.phone)+'">'+esc(o.phone)+'</a>' : '';
  return '<div class="card '+esc(o.status)+'" style="animation-delay:'+Math.min(i,8)*40+'ms">'
   +'<div class="top"><span class="code">'+esc(o.id)+'</span><span class="time">'+t+' · '+(o.lang==='uz'?'UZ':'RU')+'</span>'+tg+'</div>'
   +'<div class="name">'+esc(o.name||'Без имени')+(ph?' <a href="tel:'+esc(o.phone)+'">'+esc(o.phone)+'</a>':'')+'</div>'
   +'<div class="kv"><span>Куда</span><span>'+esc(dest)+'</span><span>Когда</span><span>'+esc(o.when)+', '+esc(o.nights)+'</span><span>Состав</span><span>'+esc(pax)+'</span><span>Бюджет</span><span>'+esc(o.budget)+' / чел.</span><span>Паспорт</span><span>'+esc(o.passport)+'</span></div>'
   +(o.status==='sale'?'<div class="note">Продажа: $'+esc(o.amount)+(o.note?' · '+esc(o.note):'')+'</div>':(o.note?'<div class="note">'+esc(o.note)+'</div>':''))
   +'<div class="btns" data-id="'+esc(o.id)+'"><button class="b t'+(o.status==='trash'?' on':'')+'" data-s="trash">Треш</button><button class="b q'+(o.status==='qual'?' on':'')+'" data-s="qual">Квал</button><button class="b s'+(o.status==='sale'?' on':'')+'" data-s="sale">Продажа</button></div></div>';
}
async function setStatus(id,status,amount,note){
  const o = DATA.items.find(x=>x.id===id); if(!o) return;
  const same = o.status===status && status!=='sale';
  const target = same ? 'new' : status;
  try{
    const r = await api({a:'status',id,status:target,amount,note});
    if(r.ok){ toast(target==='new'?'Сброшено':'Сохранено: '+ST[target]); if(navigator.vibrate) navigator.vibrate(10); load(); } else toast('Ошибка: '+r.error);
  }catch(e){ toast('Нет связи'); }
}

document.addEventListener('click',e=>{
  const st = e.target.closest('.stat'); if(st){ FILTER=st.dataset.f; render(); return; }
  const b = e.target.closest('.b[data-s]'); if(b){
    const id = b.parentNode.dataset.id, s = b.dataset.s;
    if(s==='sale'){ pending = id; $('#amt').value=''; $('#note').value=''; $('#sheet').classList.add('show'); setTimeout(()=>$('#amt').focus(),50); }
    else setStatus(id,s);
  }
});
$('#amtOk').onclick = () => { const v = Number($('#amt').value); if(!(v>0)){ $('#amt').focus(); return; } $('#sheet').classList.remove('show'); setStatus(pending,'sale',v,$('#note').value); };
$('#amtNo').onclick = () => $('#sheet').classList.remove('show');
$('#enter').onclick = () => { KEY = $('#key').value.trim(); if(!KEY) return; ls.set('mk',KEY); $('#lerr').textContent=''; show(true); load(); };
$('#key').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#enter').click(); });
$('#day').onchange = e => { DAY = e.target.value; load(); };
$('#refresh').onclick = load;
$('#q').oninput = () => DATA && render();
setInterval(()=>{ if(!document.hidden && KEY && !$('#sheet').classList.contains('show')) load(); }, 30000);

DAY = today(); $('#day').value = DAY;
if(KEY){ show(true); load(); } else show(false);
</script>
</body>
</html>
